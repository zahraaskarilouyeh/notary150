<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفترخانه اسناد رمی</title>

    body {
      font-family: sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
      direction: rtl;
      color: #2c3e50;
    }
    h1 {
      text-align: center;
      color: #1a237e;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      background-color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px 15px;
      text-align: center;
    }
    th {
      background-color: #3f51b5;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f0f0f0;
    }
    .footer {
      text-align: center;
      margin-top: 50px;
      color: #757575;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>دفترخانه اسناد رمی</h1>
  <table>
    <thead>
      <tr>
        <th>شماره دفتر</th>
        <th>نام سردفتر</th>
        <th>آدرس</th>
        <th>شماره تماس</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>۱۵۰</td>
        <td>زهرا عسکری</td>
        <td>شال، بلوار امام خمینی، بعد از اداره آب</td>
        <td>02834413426</td>
      </tr>
    </tbody>
  </table>
  <div class="footer">
    طراحی شده توسط zahraaskari عزیز
  </div>
</body>
</html>
